# ZViewer 单文件版自动构建（Windows + Linux）
# 触发方式：
#   1. push 到 main 分支 → 构建并上传 artifact
#   2. push tag (v*) → 构建并发布到 GitHub Releases
#   3. 手动触发（workflow_dispatch）

name: Build Single-File (Windows + Linux)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            flag: --linux
            artifact-name: zviewer-linux-x64
            dist-dir: linux
            ext: .tar.gz
          - os: windows-latest
            flag: --win
            artifact-name: zviewer-windows-x64
            dist-dir: win
            ext: .zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & package single-file
        # build-all.js --win/--linux 会依次执行：
        #   1. tsc 编译后端 → 2. vite 构建前端 → 3. pkg 打包 3 个 exe
        #   4. 复制启动脚本 → 5. 产物输出到 dist/win/ 或 dist/linux/
        run: node build-all.js ${{ matrix.flag }}

      - name: Package artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: tar czf ${{ matrix.artifact-name }}.tar.gz -C dist/${{ matrix.dist-dir }} .

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path dist/${{ matrix.dist-dir }}/* -DestinationPath ${{ matrix.artifact-name }}.zip

      # === Docker 镜像构建（仅 Linux） ===
      - name: Set up Docker Buildx
        if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: matrix.os == 'ubuntu-latest'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker meta (tags)
        if: matrix.os == 'ubuntu-latest'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/zviewer
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        if: matrix.os == 'ubuntu-latest'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.linux-single
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}${{ matrix.ext }}
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'zviewer-*'
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zviewer-linux-x64.tar.gz
            zviewer-windows-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}