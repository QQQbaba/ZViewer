services:
  zviewer:
    build:
      context: .
      dockerfile: Dockerfile.linux-single
    ports:
      - "3333:3333"   # 后端 API + WebSocket
      - "4173:4173"   # 前端页面
      - "3334:3334"   # RTMP 推流 (OBS)
      - "3335:3335"   # HTTP-FLV 拉流
    volumes:
      - zviewer-data:/app/config
    restart: unless-stopped

volumes:
  zviewer-data:
